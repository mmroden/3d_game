# HAND-AUTHORED: the credits — the team, and every third-party source the
# game ships or was built from, with the license it came under and the
# credit line it owes — the one place those facts live. Two renders, one
# truth: `make credits` writes docs/CREDITS.md, and void_logic::credits
# embeds this file for the menu's credits crawl. `make assets` fetches
# every declared download to its path and holds it to its checksum (an
# unpinned or mismatched download fails the stage); the audit holds the
# committed page to the render, every file git tracks under assets/ to a
# source, and every artist the audio files name in their own tags
# (catalog/audio_credits.generated.toml, their credits as read at
# ingestion) to the source claiming them.
#
# [[team]]: name, role — in crawl order.
# [[source]]: key (stable id), name, author, url, license (as the source
# states it; verified = false marks a line still to be checked against the
# seller's terms), credit (the line the license or the source asks for,
# verbatim), used_for, contribution (the ONE short line the in-game crawl
# shows above the author — "Talon hull model"; the crawl is contribution,
# then person, in this file's order), packs (path prefixes under assets/
# this source covers — a directory, a file, or the leading part of a file
# name; the audit's join from the files on disk to the credit they owe).
# Optional: ships = false for a pack in the repository nothing installs
# from (on the page, off the crawl, no contribution line); downloads =
# [{ url, path, sha256 }] for files acquired by URL rather than purchase —
# sha256 is the pin.
#
# Provenance (2026-09-09): the license files, terms PDFs and audio
# metadata inside the packs; the owner's CGTrader order history for the
# purchased models; a rendered preview (make previews) where a hull's
# file carried no seller trace; the owner's word for the audio sellers.

