# HAND-AUTHORED: every third-party source the game ships or was built
# from, with the license it came under and the credit line it owes —
# the one place those facts live. `make credits` renders docs/CREDITS.md
# from this file; `make assets` fetches every declared download to its
# path and holds it to its checksum (an unpinned or mismatched download
# fails the stage); the audit holds the committed page to the render.
#
# Fields: key (stable id), name, author, url, license (as the source
# states it; verified = false marks a line still to be checked against
# the seller's terms), credit (the line the license or the source asks
# for, verbatim), used_for. Optional downloads = [{ url, path, sha256 }]
# for files acquired by URL rather than purchase; sha256 is the pin.

