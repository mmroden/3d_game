# HAND-AUTHORED kit manifest: which kits exist, their paradigm, and where
# their pieces install. The kit's GRID (tile/story) is never authored — the
# probe derives it from the assembly recipe + installed meshes into
# kits.generated.toml, and the linker joins the two (owner 2026-07-05: two
# hand-transcribed dimension copies had already drifted into folklore).
# Pitch and paradigm derive from kits; nothing else in the roster data may
# state a cell dimension.

# Skies: the panorama a fixed environment's openings look out on (owner
# 2026-09-08: "the exterior being a skyscape goes with the story"). One
# entry per picture; a fixed kit names its sky by key. `texture` is the
# installed res:// path (make assets copies assets/sky/ into
# godot/addons/sky/); `attribution` joins catalog/attributions.toml — the
# credits page and the audit hold every sky to a credited, pinned source.
[skies.starmap_2020]
texture = "res://addons/sky/starmap_2020_8k_gal.exr"
attribution = "nasa_deep_star_maps_2020"

[kits.quaternius_megakit]
paradigm = "layered"
install_dir = "godot/addons/quaternius/modularscifimegakit"

# Panel kits author ONE policy knob: wall_coverage, the minimum censused
# face coverage for a piece to serve as a wall. Membership itself derives
# from the probe's census (kits.generated.toml): square, cell-sized, and
# covered to the bar — solid plates wall, truss frames and strips furnish.
[kits.sf_panels_vol1]
paradigm = "panel"
install_dir = "godot/addons/walls"
wall_coverage = 0.9

[kits.sf_panels_vol3]
paradigm = "panel"
install_dir = "godot/addons/walls_vol3"
wall_coverage = 0.9

[kits.apartment]
paradigm = "fixed"
install_dir = "godot/addons/environments"
# Fixed kits are the one authored-grid exception: no recipe exists to
# derive from, so the declared scale IS the pitch (world units per model
# meter), and the kit joins its authored zone map by environment key.
scale = 5.0
environment = "apartment"
sky = "starmap_2020"

# Planet 3's other locations (2026-09-06): planet_3.toml deals two of its
# four per run. Each scene ships in model meters (convert-environment.py
# fixes provider units; out/metrics/<key>.toml has the extents) and the
# scale below is the owner's look knob — DRAFTS pending a look in-game:
# 5.0 matches the apartment's gigantic-home read for the two houses; the
# office is a whole building (66 x 30 x 60 m at 1x), so it starts lower.
[kits.hill_house]
paradigm = "fixed"
install_dir = "godot/addons/environments"
scale = 5.0
environment = "hill_house"
sky = "starmap_2020"

[kits.office_building]
paradigm = "fixed"
install_dir = "godot/addons/environments"
scale = 2.0
environment = "office_building"
sky = "starmap_2020"

[kits.mountain_villa]
paradigm = "fixed"
install_dir = "godot/addons/environments"
scale = 5.0
environment = "mountain_villa"
sky = "starmap_2020"
