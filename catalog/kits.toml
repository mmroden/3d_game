# HAND-AUTHORED kit manifest: which kits exist, their paradigm, and where
# their pieces install. The kit's GRID (tile/story) is never authored — the
# probe derives it from the assembly recipe + installed meshes into
# kits.generated.toml, and the linker joins the two (owner 2026-07-05: two
# hand-transcribed dimension copies had already drifted into folklore).
# Pitch and paradigm derive from kits; nothing else in the roster data may
# state a cell dimension.

[kits.quaternius_megakit]
paradigm = "layered"
install_dir = "godot/addons/quaternius/modularscifimegakit"

# Panel kits author ONE policy knob: wall_coverage, the minimum censused
# face coverage for a piece to serve as a wall. Membership itself derives
# from the probe's census (kits.generated.toml): square, cell-sized, and
# covered to the bar — solid plates wall, truss frames and strips furnish.
[kits.sf_panels_vol1]
paradigm = "panel"
install_dir = "godot/addons/walls"
wall_coverage = 0.9

[kits.sf_panels_vol3]
paradigm = "panel"
install_dir = "godot/addons/walls_vol3"
wall_coverage = 0.9

[kits.apartment]
paradigm = "fixed"
install_dir = "godot/addons/environments"
# Fixed kits are the one authored-grid exception: no recipe exists to
# derive from, so the declared scale IS the pitch (world units per model
# meter), and the kit joins its authored zone map by environment key.
scale = 5.0
environment = "apartment"
