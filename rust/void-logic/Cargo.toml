[package]
name = "void_logic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
petgraph = "0.8"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
# The asset probe (roster/probe.rs, run by `make assets`) measures installed
# glTF models; parse-only, never shipped in the game dylib.
gltf = { version = "1", default-features = false, features = ["import", "utils"] }
# The visual-contract suite (tests/visual.rs) decodes captured frames
# (image is already in-tree under gltf).
image = { version = "0.25", default-features = false, features = ["png"] }
