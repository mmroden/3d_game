# Planet 3 — the childhood places at gigantic scale: the apartment, the
# hill house, the office building, the mountain villa. Each run DEALS
# two of the four (owner 2026-09-06), one per level, in a seeded order —
# the file names the set, the run picks the pair. Fixed planets declare
# no rooms (the dealt environment's zones are the room count) and stage
# a boss at EVERY level (an open house has no room seal for a miniboss).
# The finale slot (relative 2) carries the hull container.

planet = 3
levels = 2
kits = ["apartment", "hill_house", "office_building", "mountain_villa"]

[[level]]
relative = 1
enemies = ["house_seeker", "house_stalker"]

[[level]]
relative = 2
enemies = ["house_seeker", "house_stalker", "house_warden"]

[[boss_slot]]
at = { relative = 1 }
boss = "boss_keeper"
escorts = { enemy = "umsfd_picket", trigger = "on_engage", count = 2 }
track = 3
reward = "consolation_pile"

[[boss_slot]]
at = { relative = 2 }
boss = "boss_keeper"
escorts = { enemy = "umsfd_picket", trigger = "on_death", count = 6 }
track = 5
reward = "hull_container"
