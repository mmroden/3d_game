# HAND-AUTHORED zones for the planet-3 apartment environment. Coordinates
# are MODEL SPACE of the installed glb (meters, Y-up: x east, y height,
# z south — the floor plan's north is -z). Boxes sit on the 1-meter
# authoring grid: integer min + integer extents, min-inclusive,
# max-exclusive, mutually non-overlapping. The declared kit scale
# multiplies everything at build time; nothing here states world units.
#
# Zones are COARSE gameplay volumes over the fixed geometry (culling,
# spawn grouping, boss/portal placement) — not wall-accurate rooms.
# Drafted from the floor-plan section (owner reviews): entry at the front
# door, galley/study west wing, the big central living space, reading
# nook east, kitchen strip north, bath lobe northwest, bedroom northeast.
#
# enemy_spawns are model-space points inside their zone's box (the linker
# rejects strays); the start zone stays enemy-free (room-0 rule), and the
# boss zone authors exactly ONE spawn — the arena anchor the staged fight
# rises from.

[environment]
key = "apartment"
model = "apartment"
window_energy_per_m2 = 4.0

# Daylight through the south/east glazing (the entry diagonal and the
# nook's window wall): afternoon sun, warm and hard enough to throw the
# window shapes across the floors.
[sun]
azimuth_deg = 150.0
elevation_deg = 35.0
energy = 1.5

# The bounce stand-in: daylight interiors read bright EVERYWHERE because
# window light rebounds off every surface — real-time has no GI, so this
# ambient approximates it (reference: the provider's daytime photos).
[ambient]
energy = 0.9

# Window panes are DERIVED from the scene's own glass materials
# (rosters/windows/apartment.toml, generated by make assets) — geometry is
# the model's truth; their light scales with pane area through
# window_energy_per_m2 on [environment] above.

[[zone]]
key = "entry"
box = { min = [-2, 0, 4], extents = [3, 3, 2] }
start = true
links = ["dining"]

[[zone]]
key = "dining"
box = { min = [-2, 0, 3], extents = [3, 3, 1] }
links = ["living", "galley"]
enemy_spawns = [[-0.5, 1.6, 3.5]]

[[zone]]
key = "galley"
box = { min = [-5, 0, 3], extents = [3, 3, 2] }
links = ["study"]
enemy_spawns = [[-3.5, 1.5, 3.8], [-2.5, 1.8, 4.2]]
loot_spawns = [[-3.0, 1.0, 4.5]]

[[zone]]
key = "study"
box = { min = [-5, 0, 0], extents = [4, 3, 3] }
links = ["living"]
enemy_spawns = [[-3.0, 1.6, 1.5], [-4.2, 1.8, 2.3]]
loot_spawns = [[-2.0, 1.0, 2.5]]

[[zone]]
key = "living"
box = { min = [-1, 0, -2], extents = [5, 3, 5] }
links = ["nook", "kitchen"]
enemy_spawns = [[1.5, 1.7, 0.5], [0.0, 1.5, -1.0], [2.8, 1.8, 1.8]]
loot_spawns = [[3.3, 1.0, -1.5]]

[[zone]]
key = "nook"
box = { min = [4, 0, -1], extents = [2, 3, 4] }
enemy_spawns = [[4.8, 1.6, 0.5]]
loot_spawns = [[5.2, 1.0, 2.0]]

[[zone]]
key = "kitchen"
box = { min = [-1, 0, -6], extents = [3, 3, 4] }
links = ["bath", "bedroom"]
enemy_spawns = [[0.0, 1.6, -4.5], [0.8, 1.8, -3.0]]
loot_spawns = [[-0.5, 1.0, -5.5]]

[[zone]]
key = "bath"
box = { min = [-3, 0, -6], extents = [2, 3, 2] }
enemy_spawns = [[-2.0, 1.5, -5.0]]

[[zone]]
key = "bedroom"
box = { min = [2, 0, -6], extents = [4, 3, 4] }
boss = true
enemy_spawns = [[4.0, 1.5, -4.0]]
loot_spawns = [[5.0, 1.0, -5.0]]
