# The enemy grammar: identity (global) + tuning (level-bound curves).
# HAND-AUTHORED — this file IS the game data; machinery never writes it.
# Copy blocks from TEMPLATE.toml; the linker names anything you get wrong.
# model = a KEY in models.generated.toml (the catalog `make assets` probes
# from the installed files) — the linker resolves it to the res:// path.
#
# ids are the GDScript/save crossing: APPEND-ONLY, never renumbered.

# ── Curves: how level-bound stats ride the level ─────────────────────────
# A curve MULTIPLIES the enemy's baseline stat. kind = "flat" (constant
# 1.0) | "ramp" (linear from at_level_1 to at_peak, flat past peak_level).
# anchor defaults to "absolute" (game level, not entry level).

[curves.flat]
kind = "flat"

# Speed: more = deadlier. Level-1 enemies crawl at 60% of baseline and
# edge past it (115%) by level 10.
[curves.speed_standard]
kind = "ramp"
at_level_1 = 0.6
at_peak = 1.15
peak_level = 10

# Cooldown is the INTERVAL between attacks, so less = deadlier: level-1
# enemies wait 1.4x their baseline between shots, 0.85x by level 10.
[curves.cooldown_standard]
kind = "ramp"
at_level_1 = 1.4
at_peak = 0.85
peak_level = 10

# HP
[curves.hp_standard]
kind = "ramp"
at_level_1 = 1.0
at_peak = 3.0
peak_level = 10

# Damage
[curves.damage_standard]
kind = "ramp"
at_level_1 = 1.0
at_peak = 1.5
peak_level = 10

# Every enemy rides these unless it overrides in [enemy.scaling]. All six
# stats are declared — flat IS a config call, not an absence.
[scaling_defaults]
speed = "speed_standard"
cooldown = "cooldown_standard"
hp = "hp_standard"
damage = "damage_standard"
detection = "flat"
attack_range = "flat"

